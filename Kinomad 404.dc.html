<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Desktop&quot;,&quot;options&quot;:[&quot;Desktop&quot;,&quot;Tablet&quot;,&quot;Mobile&quot;],&quot;section&quot;:&quot;Preview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#639392&quot;,&quot;section&quot;:&quot;Brand&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bgColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1a1a1a&quot;,&quot;options&quot;:[&quot;#1a1a1a&quot;,&quot;#EDF0F4&quot;],&quot;section&quot;:&quot;Brand&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;navColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#050505&quot;,&quot;section&quot;:&quot;Brand&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this._applyTheme();
  }
  _applyTheme() {
    const g = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };
    const s = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
    const pA = this.props.accent ?? '#639392';
    const pB = this.props.bgColor ?? '#1a1a1a';
    const pN = this.props.navColor ?? '#050505';
    const accent = pA;
    const bg = pB;
    const nav = pN;
    document.body.style.setProperty('--accent', accent);
    document.body.style.setProperty('--bg', bg);
    document.body.style.setProperty('--nav', nav);
    const fw = { Tablet: '834px', Mobile: '393px' }[(this.props.device || 'Desktop')];
    if (fw) document.body.style.setProperty('--frame-w', fw);
    else document.body.style.removeProperty('--frame-w');
  }

  renderVals() {
    this._applyTheme();
    return {};
  }
}
</script>
